services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesdev}
      POSTGRES_DB: ${POSTGRES_DB:-salesdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesdev} -d ${POSTGRES_DB:-salesdev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  leads:
    build:
      context: ./leads
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salesdev}:${POSTGRES_PASSWORD:-salesdev}@postgres:5432/${POSTGRES_DB:-salesdev}
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      LEADS_SERVICE_INTERNAL_SECRET: ${LEADS_SERVICE_INTERNAL_SECRET:-dev-internal-secret}
      RESEARCH_SERVICE_URL: http://research:8002
      SECRET_KEY: ${SECRET_KEY:-change-me-leads}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,leads,nginx,research,outreach
    volumes:
      - linkedin_data:/app/data
      - media_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    ports:
      - "8001:8001"

  research:
    build:
      context: .
      dockerfile: research/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salesdev}:${POSTGRES_PASSWORD:-salesdev}@postgres:5432/${POSTGRES_DB:-salesdev}
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LEADS_SERVICE_URL: http://leads:8001
      SECRET_KEY: ${SECRET_KEY:-change-me-research}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,research,nginx,leads,outreach
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      leads:
        condition: service_started
    expose:
      - "8002"
    ports:
      - "8002:8002"

  outreach:
    build:
      context: .
      dockerfile: outreach/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salesdev}:${POSTGRES_PASSWORD:-salesdev}@postgres:5432/${POSTGRES_DB:-salesdev}
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      LEADS_SERVICE_INTERNAL_SECRET: ${LEADS_SERVICE_INTERNAL_SECRET:-dev-internal-secret}
      LEADS_SERVICE_URL: http://leads:8001
      SECRET_KEY: ${SECRET_KEY:-change-me-outreach}
      DEBUG: "false"
      CHROMA_HOST: http://chroma:8000
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD:-}
      GMAIL_SENDER_NAME: ${GMAIL_SENDER_NAME:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:3000/settings/google-callback}
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}
      FOLLOWUP_DAYS: ${FOLLOWUP_DAYS:-3}
      # Docker service names so n8n (and nginx) can call outreach internally
      ALLOWED_HOSTS: localhost,127.0.0.1,outreach,nginx,n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      leads:
        condition: service_started
      n8n:
        condition: service_started
    expose:
      - "8003"
    ports:
      - "8003:8003"
    volumes:
      - media_data:/data

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
    expose:
      - "8000"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_PASSWORD:-changeme}"
      # Gmail workflow uses built-in nodes only; skip npm registry fetch (avoids ECONNRESET noise)
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - leads
      - research
      - outreach
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  linkedin_data:
  n8n_data:
  media_data:
